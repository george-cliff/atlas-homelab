<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="atlas-flat-title atlas-flat-desc">
  <title id="atlas-flat-title">Atlas — expanded Seven Sisters celestial pattern</title>
  <desc id="atlas-flat-desc">Atlas supports a celestial globe, across which seven four-point stars are arranged in a spacious, stylised Pleiades pattern. Their relative structure is retained but the separations are exaggerated for the emblem.</desc>
  <defs>
    <clipPath id="atlas-inner-sphere-clip">
      <circle cx="128" cy="125" r="89.6"/>
    </clipPath>
  </defs>
  <g id="atlas-logo-artwork">
    <g id="atlas-rear-malachite-equator">
      <path d="M36 125Q128 92 220 125" fill="none" stroke="#89C2A4" stroke-width="2.7" stroke-opacity="0.61" stroke-linecap="round" stroke-linejoin="round" id="atlas-rear-equator-arc"/>
    </g>
    <g id="atlas-under-globe-support" clip-path="url(#atlas-inner-sphere-clip)" opacity="0.71">
      <g id="atlas-support-arms">
        <path d="M125 132C113 123 104 115 97 111C79 101 61 95 45 85" fill="none" stroke="#D99B88" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M131 132C143 123 152 115 159 111C177 101 195 95 211 85" fill="none" stroke="#D99B88" stroke-width="6.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g id="atlas-support-column">
        <rect x="117" y="114" width="22" height="83" fill="#C46D57"/>
        <rect x="96" y="95" width="64" height="11" rx="5.5" fill="#D99B88"/>
        <rect x="108" y="106" width="40" height="9" rx="4.5" fill="#C46D57"/>
        <rect x="108" y="196" width="40" height="9" rx="4.5" fill="#C46D57"/>
        <rect x="96" y="205" width="64" height="9" rx="4.5" fill="#D99B88"/>
      </g>
      <g id="atlas-support-joints">
        <circle cx="45" cy="85" r="2.8" fill="#C46D57"/>
        <circle cx="45" cy="85" r="1.0" fill="#EAC1B3" opacity=".7"/>
        <circle cx="211" cy="85" r="2.8" fill="#C46D57"/>
        <circle cx="211" cy="85" r="1.0" fill="#EAC1B3" opacity=".7"/>
      </g>
    </g>
    <g id="atlas-foreground-globe-grid">
